name: Import WDCKit files

on:
  push:
    branches: [wdckit-import]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download WDCKit Linux package and manual
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o wdckit_lin.zip https://downloads.wdc.com/wdapp/wdckit_lin.zip
          curl -fL --retry 3 -o WDCKit_Users_Guide.pdf https://device.report/m/72c66fd1a403ba6917525b37aaf0330e30dfe53bc239a0b67de59fc06dec9d05_optim.pdf
          test -s wdckit_lin.zip
          test -s WDCKit_Users_Guide.pdf
      - name: Commit imported files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add wdckit_lin.zip WDCKit_Users_Guide.pdf
          git commit -m "Add WDCKit 3.3.1.0 Linux package and user guide"
          git push
